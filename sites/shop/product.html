<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Gear – Product</title>
  <link rel="stylesheet" href="/assets/demo.css">
  <script src="shop.js"></script>
</head>
<body>
  <main id="product"></main>
  <script>
    mountHeader();
    const id = new URLSearchParams(location.search).get("id");
    const p = CATALOG.find((x) => x.id === id);
    const root = document.getElementById("product");
    if (!p) {
      root.innerHTML = '<h1>Product not found</h1><p><a href="index.html">Back to shop</a></p>';
    } else {
      document.title = "Northwind Gear – " + p.name;
      root.innerHTML = `
        <p><a href="index.html">← Back to search</a></p>
        <article class="card" data-product-id="${p.id}">
          <h1>${p.name}</h1>
          <p>${p.desc}</p>
          <p class="price" id="price">${money(p.price)}</p>
          <form id="add-form" class="row">
            <div style="max-width:120px">
              <label for="qty">Quantity</label>
              <input id="qty" name="qty" type="number" min="1" max="10" value="1">
            </div>
            <div><button type="submit">Add to cart</button></div>
          </form>
          <p id="add-status" role="status"></p>
        </article>`;
      document.getElementById("add-form").addEventListener("submit", (ev) => {
        ev.preventDefault();
        const qty = parseInt(document.getElementById("qty").value, 10);
        const status = document.getElementById("add-status");
        if (!Number.isInteger(qty) || qty < 1 || qty > 10) {
          status.className = "error";
          status.textContent = "Quantity must be between 1 and 10.";
          return;
        }
        addToCart(p.id, qty);
        status.className = "success";
        status.textContent = "Added " + qty + " × " + p.name + " to cart.";
      });
    }
  </script>
</body>
</html>
