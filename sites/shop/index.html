<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northwind Gear – Shop</title>
  <link rel="stylesheet" href="/assets/demo.css">
  <script src="shop.js"></script>
</head>
<body>
  <main>
    <h1>Shop</h1>
    <form id="search-form" class="row card" role="search" aria-label="Product search">
      <div>
        <label for="q">Search products</label>
        <input id="q" name="q" type="search" placeholder="e.g. headphones">
      </div>
      <div>
        <label for="sort">Sort by</label>
        <select id="sort" name="sort">
          <option value="relevance">Relevance</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
      <div style="flex:0">
        <button type="submit">Search</button>
      </div>
    </form>
    <p id="result-count" class="muted" role="status"></p>
    <section aria-label="Results" class="grid" id="results"></section>
  </main>
  <script>
    mountHeader();
    const params = new URLSearchParams(location.search);
    const q = (params.get("q") || "").trim().toLowerCase();
    const sort = params.get("sort") || "relevance";
    document.getElementById("q").value = params.get("q") || "";
    document.getElementById("sort").value = sort;

    // Changing the sort re-runs the search immediately, like many real shops do.
    document.getElementById("sort").addEventListener("change", () => {
      document.getElementById("search-form").requestSubmit();
    });

    let items = CATALOG.filter(
      (p) => !q || p.name.toLowerCase().includes(q) || p.category.includes(q)
    );
    if (sort === "price-asc") items = items.slice().sort((a, b) => a.price - b.price);
    if (sort === "price-desc") items = items.slice().sort((a, b) => b.price - a.price);

    document.getElementById("result-count").textContent =
      items.length + (items.length === 1 ? " product" : " products") + (q ? ' for "' + q + '"' : "");
    document.getElementById("results").innerHTML = items
      .map(
        (p) => `
        <article class="card product" data-product-id="${p.id}">
          <h2 style="font-size:17px;margin:0 0 6px"><a href="product.html?id=${p.id}">${p.name}</a></h2>
          <p class="muted" style="margin:0 0 6px">${p.desc}</p>
          <p class="price" style="margin:0">${money(p.price)}</p>
        </article>`
      )
      .join("");
  </script>
</body>
</html>
