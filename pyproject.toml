[project]
name = "web-task-agent"
version = "0.1.0"
description = "A reliable, observable, measured browser agent: observe -> plan -> act -> verify, with guardrails, traces and a task-suite harness."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Désiré Ouedraogo" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
wta = "wta.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The snapshot builder embeds a JavaScript program as a string.
"src/wta/snapshot.py" = ["E501"]
"tests/**" = ["PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wta"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "browser: tests that launch headless Chromium against the bundled demo sites",
]
